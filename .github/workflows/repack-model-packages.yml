name: Repack published models into per-model ZIPs
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/repack-model-packages.yml']
permissions:
  contents: write
concurrency: model-files-v2-publication
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and repack the existing published weights
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, http.client, json, os, subprocess, tempfile, zipfile
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.parse import quote, urlsplit

          repo, commit = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          manifest = json.load(urlopen(f'https://raw.githubusercontent.com/{repo}/{commit}/model_manifest.json', timeout=60))
          tag = manifest['releaseTag']
          assert tag == 'model-files-v2'
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          def release():
              return next((item for item in json.loads(gh('api', f'repos/{repo}/releases?per_page=100')) if item['tag_name'] == tag), None)
          if release() is None:
              gh('api', '--method', 'POST', f'repos/{repo}/releases', '-f', f'tag_name={tag}', '-f', 'target_commitish=main', '-F', 'draft=true',
                  '-f', 'name=Saber-Translator 模型包 · 每个模型一个 ZIP',
                  '-f', 'body=11 个独立模型包。每个 ZIP 保留原模型目录、权重及配套配置；可在应用设置 → 模型管理中自动下载安装，或离线解压到 models/。旧版 model-files-v1 保留供旧客户端使用。')
          for model in manifest['models']:
              record = model['archive']
              name = Path(record['path']).name
              assets = {asset['name']: asset for asset in release()['assets']}
              if name in assets:
                  assert assets[name]['size'] == record['size'] and assets[name]['digest'] == 'sha256:' + record['sha256']
                  continue
              with tempfile.TemporaryDirectory(prefix='model-package-') as temp:
                  root = Path(temp)
                  for file in model['files']:
                      path = root / file['path']
                      path.parent.mkdir(parents=True, exist_ok=True)
                      source = f"https://github.com/{repo}/releases/download/model-files-v1/{file['sha256']}-{path.name}"
                      subprocess.run(['curl', '--fail', '--location', '--retry', '3', '--silent', '--show-error', '--output', str(path), source], check=True)
                      with path.open('rb') as data:
                          assert path.stat().st_size == file['size'] and hashlib.file_digest(data, 'sha256').hexdigest() == file['sha256']
                  archive = root / name
                  with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_STORED) as package:
                      for file in model['files']:
                          info = zipfile.ZipInfo(file['path'], date_time=(1980, 1, 1, 0, 0, 0))
                          info.create_system = 3
                          info.external_attr = 0o100644 << 16
                          info.file_size = file['size']
                          with (root / file['path']).open('rb') as source, package.open(info, 'w') as output:
                              while chunk := source.read(256 * 1024):
                                  output.write(chunk)
                  with archive.open('rb') as data:
                      assert archive.stat().st_size == record['size'] and hashlib.file_digest(data, 'sha256').hexdigest() == record['sha256'], name
                  upload = urlsplit(release()['upload_url'].split('{', 1)[0])
                  assert upload.hostname == 'uploads.github.com'
                  connection = http.client.HTTPSConnection(upload.hostname, timeout=1800)
                  connection.putrequest('POST', upload.path + '?name=' + quote(name, safe=''))
                  connection.putheader('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
                  connection.putheader('Accept', 'application/vnd.github+json')
                  connection.putheader('Content-Type', 'application/zip')
                  connection.putheader('Content-Length', str(record['size']))
                  connection.putheader('User-Agent', 'Saber-Translator-model-publication')
                  connection.endheaders()
                  with archive.open('rb') as data:
                      while chunk := data.read(256 * 1024):
                          connection.send(chunk)
                  response = connection.getresponse()
                  result = response.read()
                  connection.close()
                  assert response.status == 201, (response.status, result[:500])
              asset = next(asset for asset in release()['assets'] if asset['name'] == name)
              assert asset['size'] == record['size'] and asset['digest'] == 'sha256:' + record['sha256']
              print(f'Published and verified {name}', flush=True)
          assert len(release()['assets']) == len(manifest['models'])
          gh('api', '--method', 'PATCH', f"repos/{repo}/releases/{release()['id']}", '-F', 'draft=false', '-f', 'make_latest=true')
          PY

